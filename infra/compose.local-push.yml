# Development-only encrypted UnifiedPush relay. Bound to loopback; never expose this open relay publicly.
name: blood-connection-local-push
services:
  ntfy:
    image: binwiederhier/ntfy:v2.38.0
    command: serve
    environment:
      NTFY_BASE_URL: http://127.0.0.1:8090
      NTFY_LISTEN_HTTP: ':80'
      NTFY_CACHE_DURATION: '1h'
      NTFY_ENABLE_SIGNUP: 'false'
    ports:
      - '127.0.0.1:8090:80'
    restart: unless-stopped
