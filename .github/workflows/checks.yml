# Run the same local checks on pull requests without deployment credentials or write access.
name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Pin actions so upstream tag changes cannot alter this workflow unexpectedly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Backend checks
        run: |
          python -m pip install -r backend/requirements.txt
          python -m unittest backend.test_app -v
      - name: Admin checks
        run: node --test admin/helpers.test.mjs admin/private-evidence.test.mjs
      # Use the official Flutter checkout matching the version tested on the Pixel.
      - name: Flutter SDK
        run: |
          git clone --depth 1 --branch 3.44.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Mobile checks
        working-directory: mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
